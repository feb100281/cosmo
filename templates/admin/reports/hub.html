{% extends "admin/base_site.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content_title %}<h1>{{ title }}</h1>{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  .rp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; max-width: 980px; }
  .rp-card { display: block; background: #fff; border: 1px solid #d7ddd3; border-top: 3px solid #1e3d32;
             border-radius: 8px; padding: 18px 22px; color: inherit; text-decoration: none; }
  .rp-card:hover { border-color: #1e3d32; box-shadow: 0 2px 10px rgba(30, 61, 50, .12); text-decoration: none; }
  .rp-card h3 { margin: 0 0 8px; font-size: 16px; color: #1e3d32; }
  .rp-card h3 i { margin-right: 8px; color: #c1663a; }
  .rp-card p { margin: 0; color: #5b6b63; font-size: 13px; line-height: 1.5; }
</style>
{% endblock %}

{% block content %}
<div class="rp-grid">
  {% for r in reports %}
  <a class="rp-card" href="{{ r.url }}">
    <h3><i class="{{ r.icon }}"></i>{{ r.title }}</h3>
    <p>{{ r.text }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
